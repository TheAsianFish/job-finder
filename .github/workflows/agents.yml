# Autonomous Claude Code agents (docs/roadmap.md -> Autonomous agents).
# Runs Claude Code headless on Patrick's Max plan via CLAUDE_CODE_OAUTH_TOKEN
# (create it locally with `claude setup-token`, then
# `gh secret set CLAUDE_CODE_OAUTH_TOKEN`). Gated by repo variable
# ENABLE_AGENTS=true. Personal outputs (weekly review, project plans, resume
# variants, outcomes) go to the PRIVATE career repo checked out at
# resume/private and are posted to Discord; only public-file changes (docs,
# reports/skill-demand.md) are proposed as a pull request here. Logs on this
# public repo print counts only.

name: Opportunity Radar Agents

on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays 08:00 PT: weekly review
  workflow_dispatch:
    inputs:
      task:
        description: "weekly-review | review-role | custom (projects: see projects.yml)"
        default: weekly-review
        required: true
      prompt:
        description: "Custom prompt (task = custom)"
        required: false
      url:
        description: "Posting link to review brutally (task = review-role)"
        required: false

concurrency:
  group: opportunity-radar-agents
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  agent:
    if: vars.ENABLE_AGENTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CAREER_KEY: ${{ secrets.CAREER_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out private career repo
        if: env.HAS_CAREER_KEY == 'true'
        uses: actions/checkout@v7
        with:
          repository: TheAsianFish/career-private
          path: resume/private
          ssh-key: ${{ secrets.CAREER_DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Read-only copy of the scanner's latest state; never saved back.
      - name: Restore job database
        uses: actions/cache/restore@v6
        with:
          path: data/opportunity_radar.db
          key: radar-db-agent-${{ github.run_id }}
          restore-keys: |
            radar-db-

      - name: Refresh deterministic reports
        run: |
          uv run opportunity-radar db migrate
          if [ -f resume/private/applications.yaml ]; then
            uv run opportunity-radar applications sync
            uv run opportunity-radar insights outcomes -o resume/private/reports/outcomes.md
          fi
          uv run opportunity-radar insights skills

      - name: Cache TinyTeX
        uses: actions/cache@v6
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('scripts/install_tinytex.sh') }}

      - name: Install Claude Code and pdfLaTeX
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null
          bash scripts/install_tinytex.sh

      - name: Brutally honest review of one role
        if: inputs.task == 'review-role'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE_URL: ${{ inputs.url }}
          DISCORD_WEBHOOK_RESUME: ${{ secrets.DISCORD_WEBHOOK_RESUME }}
          CAREER_GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
        run: uv run opportunity-radar resume review-url "$ROLE_URL"

      - name: Run agent
        if: inputs.task != 'review-role'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TASK: ${{ inputs.task || 'weekly-review' }}
          CUSTOM_PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set"; exit 1
          fi
          if [ "$TASK" = "custom" ]; then
            printf '%s\n\nRead CLAUDE.md and docs/roadmap.md first and follow their ground rules.\n' \
              "$CUSTOM_PROMPT" > /tmp/prompt.md
          else
            cp "agents/prompts/${TASK}.md" /tmp/prompt.md
          fi
          claude -p "$(cat /tmp/prompt.md)" \
            --model opus \
            --max-turns 60 \
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(uv run opportunity-radar *),Bash(sqlite3 *),Bash(git log *),Bash(git diff *),Bash(git show *),Bash(git -C resume/private log *),Bash(date *)" \
            > /tmp/agent.log 2>&1 || { echo "agent failed (log withheld: public repo)"; tail -c 300 /tmp/agent.log | grep -iE "error|auth|limit" || true; exit 1; }
          echo "agent finished"

      - name: Refresh resume variants
        if: env.HAS_CAREER_KEY == 'true' && (inputs.task || 'weekly-review') == 'weekly-review'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run opportunity-radar resume variants --polish > /dev/null && echo "variants built"

      - name: Save private outputs and post to Discord
        if: always() && env.HAS_CAREER_KEY == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_AGENT_LOG: ${{ secrets.DISCORD_WEBHOOK_AGENT_LOG }}
          TASK: ${{ inputs.task || 'weekly-review' }}
        run: |
          report=$(find resume/private/reports -name "${TASK}-*.md" -type f 2>/dev/null | sort | tail -1)
          if [ -n "$report" ]; then
            title="Weekly review"
            uv run opportunity-radar notify markdown "$report" --title "📊 $title — $(date -u +%Y-%m-%d)" --channel agent-log
          fi
          cd resume/private
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name=TheAsianFish -c user.email=jmchung2006@gmail.com \
              commit -q -m "agent: ${TASK} $(date -u +%Y-%m-%d)"
            # Other writers (scan deliveries, local `apply`) may have pushed
            # meanwhile: rebase onto them and retry instead of failing.
            for attempt in 1 2 3; do
              if git pull -q --rebase && git push -q; then echo "private repo updated"; break; fi
              [ "$attempt" = 3 ] && { echo "private push failed"; exit 1; }
              sleep 5
            done
          fi

      - name: Open pull request with the agent's changes
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task || 'weekly-review' }}
        run: |
          git restore --staged . 2>/dev/null || true
          git checkout -- data 2>/dev/null || true
          # The regenerated aggregate report alone is not worth a PR; the
          # agent reads it from this checkout either way.
          git checkout -- reports/skill-demand.md 2>/dev/null || true
          if [ -z "$(git status --porcelain -- . ':!data' ':!resume')" ]; then
            echo "Agent made no changes."; exit 0
          fi
          branch="agent/${TASK}-${{ github.run_id }}"
          git config user.name "TheAsianFish"
          git config user.email "jmchung2006@gmail.com"
          git checkout -b "$branch"
          git add -- . ':!data' ':!resume'
          git commit -m "agent: ${TASK} ($(date -u +%Y-%m-%d))"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Agent: ${TASK} $(date -u +%Y-%m-%d)" \
            --body "Automated ${TASK} run ${{ github.run_id }}. Review before merging."
