name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src

      - name: Migration check
        run: |
          OPPORTUNITY_RADAR_DB_URL="sqlite:///./data/ci.db" uv run alembic upgrade head
          OPPORTUNITY_RADAR_DB_URL="sqlite:///./data/ci.db" uv run alembic check

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing -q
