# OPTIONAL cloud scanning while your Mac is offline (spec §20).
# Local mode is canonical. This workflow is disabled unless you set the
# repository variable ENABLE_CLOUD_SCAN=true and add DISCORD_WEBHOOK_URL
# to Actions secrets. SQLite state is persisted via the Actions cache —
# best-effort continuity, not a primary datastore. If the cache is evicted
# (10 GB repo limit, LRU) the next run re-baselines silently, by design.
#
# Note: GitHub scheduled workflows can be delayed several minutes.

name: Opportunity Radar Scan

on:
  schedule:
    - cron: "17 * * * *"   # non-round minute to avoid scheduler congestion
  workflow_dispatch:

concurrency:
  group: opportunity-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    if: vars.ENABLE_CLOUD_SCAN == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # actions/cache (not artifacts): download-artifact@v4 cannot fetch an
      # artifact uploaded by a *previous* run without an explicit run-id, so
      # the old artifact-based restore always failed and every hourly run
      # re-baselined an empty database — meaning no alerts were ever sent.
      # Cache restore-keys match across runs by prefix (newest first).
      - name: Restore previous database
        uses: actions/cache/restore@v4
        with:
          path: data/opportunity_radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: |
            radar-db-

      - name: Initialize and scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPPORTUNITY_RADAR_SECRET_KEY: ${{ secrets.OPPORTUNITY_RADAR_SECRET_KEY }}
          TZ: America/Los_Angeles
        run: |
          uv run opportunity-radar db migrate
          uv run opportunity-radar scan
          uv run opportunity-radar notify digest --if-due

      - name: Persist database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/opportunity_radar.db
          key: radar-db-${{ github.run_id }}
