# Cloud scanning (spec §20). Disabled unless the repository variable
# ENABLE_CLOUD_SCAN=true and the DISCORD_WEBHOOK_URL Actions secret are set.
# SQLite state is persisted via the Actions cache — best-effort continuity,
# not a primary datastore. If the cache is evicted the next run re-baselines
# silently, by design (the no-flood guard makes that safe).
#
# Cadence (AD-24): GitHub delays and drops scheduled runs on quiet repos —
# an hourly cron fired about four times a day here. So each run dispatches
# the next one when it finishes, paced so runs start CHAIN_MIN_INTERVAL_SECONDS
# (default 600) apart, while the cron below only restarts the chain if it
# ever breaks. Stop the chain with:  gh variable set CHAIN_SCANS --body false
#
# Each run decides its own scope (`scan --mode auto`): the full registry when
# the last full scan is about an hour old, otherwise the hot set (core-tier
# employers + Simplify feeds).
#
# Career data (AD-27): the private repo TheAsianFish/career-private is checked
# out at resume/private via the CAREER_DEPLOY_KEY deploy key. Each run syncs
# applications.yaml (and any Simplify exports in imports/) into the DB, and
# fresh high-priority alerts get a resume fit check: silent when the resume
# fits, a review + tailored PDF in Discord when it doesn't (AD-29). Logs here
# are public, so those steps print counts only.

name: Opportunity Radar Scan

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# One run at a time against one SQLite state; a newer pending run replaces
# an older pending one, which is exactly the right behaviour for a poller.
concurrency:
  group: opportunity-radar-scan
  cancel-in-progress: false

permissions:
  actions: write    # dispatch the next run in the chain; prune old DB caches
  contents: read

jobs:
  scan:
    if: vars.ENABLE_CLOUD_SCAN == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CAREER_KEY: ${{ secrets.CAREER_DEPLOY_KEY != '' }}
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Record start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Check out private career repo
        if: env.HAS_CAREER_KEY == 'true'
        uses: actions/checkout@v7
        with:
          repository: TheAsianFish/career-private
          path: resume/private
          ssh-key: ${{ secrets.CAREER_DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag is published
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # actions/cache (not artifacts): download-artifact cannot fetch an
      # artifact uploaded by a *previous* run without an explicit run-id.
      # Cache restore-keys match across runs by prefix (newest first).
      - name: Restore previous database
        uses: actions/cache/restore@v6
        with:
          path: data/opportunity_radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: |
            radar-db-

      - name: Initialize and scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPPORTUNITY_RADAR_SECRET_KEY: ${{ secrets.OPPORTUNITY_RADAR_SECRET_KEY }}
          TZ: America/Los_Angeles
        run: |
          uv run opportunity-radar db migrate
          if [ -f resume/private/applications.yaml ]; then
            uv run opportunity-radar applications sync --push
          fi
          uv run opportunity-radar scan --mode auto
          uv run opportunity-radar notify digest --if-due

      - name: Count alerts awaiting a resume check
        id: resumes
        if: env.HAS_CAREER_KEY == 'true'
        run: echo "pending=$(uv run opportunity-radar resume deliver --count 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Cache TinyTeX
        if: steps.resumes.outputs.pending != '' && steps.resumes.outputs.pending != '0'
        uses: actions/cache@v6
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('scripts/install_tinytex.sh') }}

      - name: Install pdfLaTeX and Claude Code
        if: steps.resumes.outputs.pending != '' && steps.resumes.outputs.pending != '0'
        run: |
          bash scripts/install_tinytex.sh
          if [ "$HAS_CLAUDE_TOKEN" = "true" ]; then npm install -g @anthropic-ai/claude-code >/dev/null; fi

      - name: Resume checks for new high-priority roles
        if: steps.resumes.outputs.pending != '' && steps.resumes.outputs.pending != '0'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISCORD_WEBHOOK_RESUME: ${{ secrets.DISCORD_WEBHOOK_RESUME }}
          # Opens bullet-proposal PRs in the private repo (AD-31).
          CAREER_GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
        run: uv run opportunity-radar resume deliver --polish --push

      - name: Persist database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/opportunity_radar.db
          key: radar-db-${{ github.run_id }}

      # Only the newest state matters; keep three for safety, drop the rest
      # instead of letting ~100 MB snapshots fill the 10 GB cache quota.
      - name: Prune old database caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key radar-db- --sort created_at --order desc --limit 100 \
            --json id --jq '.[3:][].id' | xargs -r -n1 gh cache delete || true

      - name: Chain the next scan
        if: always() && vars.CHAIN_SCANS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MIN_GAP: ${{ vars.CHAIN_MIN_INTERVAL_SECONDS || '600' }}
        run: |
          elapsed=$(( $(date +%s) - RUN_STARTED ))
          wait=$(( MIN_GAP - elapsed ))
          if [ "$wait" -gt 0 ]; then
            echo "Run took ${elapsed}s; next scan in ${wait}s."
            sleep "$wait"
          fi
          gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}"
