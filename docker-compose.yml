services:
  radar:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped

  dashboard:
    build: .
    command: ["uv", "run", "opportunity-radar", "serve", "--host", "0.0.0.0"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    # Published only on loopback so the dashboard stays local (spec §24).
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
