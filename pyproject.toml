[project]
name = "opportunity-radar"
version = "1.0.0"
description = "Local-first SWE internship and new-grad monitor with Discord alerts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Patrick Chung" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]

[project.scripts]
opportunity-radar = "opportunity_radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM108", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
warn_unused_ignores = false
no_implicit_optional = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/opportunity_radar"]
omit = ["src/opportunity_radar/web/*", "src/opportunity_radar/scheduler/*"]
