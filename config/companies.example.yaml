# Starter company registry. Copy to config/companies.yaml and edit freely.
#
# Fields:
#   id: unique slug            tier: core | strong | broad | exploratory
#   adapter: greenhouse | lever | ashby | jsonld | sitemap | html_generic |
#            playwright | auto (fingerprint from career_urls)
#   adapter_config: adapter-specific (board_token / site / job_board_name / selectors)
#   enabled: false entries are seeds that need adapter work — validate before enabling.
#
# Verify any entry with:  uv run opportunity-radar companies validate --company <id>
# Board tokens below are best-effort seeds, not guarantees; if validation fails,
# run `opportunity-radar companies discover <domain>` to re-detect.

