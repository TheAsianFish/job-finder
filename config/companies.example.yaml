# Starter company registry. Copy to config/companies.yaml and edit freely.
#
# Fields:
#   id: unique slug            tier: core | strong | broad | exploratory
#   adapter: greenhouse | lever | ashby | workday | smartrecruiters | eightfold |
#            amazon_jobs | github_careers | atlassian_careers | simplify |
#            jsonld | sitemap | html_generic | playwright |
#            auto (fingerprint from career_urls)
#   adapter_config: adapter-specific (board_token / site / job_board_name /
#            host+site (workday) / company (smartrecruiters) / base_url+domain
#            (eightfold) / selectors)
#   enabled: false entries are seeds that need adapter work — validate before enabling.
#
# Verify any entry with:  uv run opportunity-radar companies validate --company <id>
# If validation fails, run: uv run opportunity-radar companies discover <domain>




