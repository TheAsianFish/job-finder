# Copy to config/profile.yaml and edit for your own situation.
# null means "unknown" — the eligibility engine surfaces the question instead of guessing.
#
# Skills below are synced from Patrick's resume (resume/private/resume.tex,
# 2026-10-07). Only skills the resume evidences are listed; they drive the
# skill score and the "Your keywords" line on every alert. Add a skill here
# only when it is also true on the resume.

candidate:
  expected_graduation: 2027-12-01
  degree_level: bachelors
  school: University of California, San Diego
  country: US

  requires_sponsorship: false
  us_citizen: true
  permanent_resident: null
  clearance_eligible: null

preferences:
  countries: [US]
  # Internship search: full-time roles stay on the dashboard, never notify.
  internships_only: true
  allow_remote: true
  willing_to_relocate: true
  # Empty = any US location is ideal (remote, hybrid and onsite all fine).
  preferred_locations: []

  role_families:
    - backend
    - ml_systems
    - fullstack
    - general_swe
    - infrastructure
    - data_infrastructure
    - developer_tools

  # Priority: Winter / Spring / Summer / Fall 2027; Fall 2026 is lower.
  target_seasons:
    - winter_2027
    - spring_2027
    - summer_2027
    - fall_2027
    - fall_2026

