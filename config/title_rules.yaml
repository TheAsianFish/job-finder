# Hard exclusions — apply ONLY when matched in the title with high confidence.
hard_exclusions:
  - senior
  - sr.
  - staff
  - principal
  - lead
  - manager
  - director
  - vp
  - head of
  - architect
  - distinguished
  - fellow
  - nurse
  - marketing
  - sales
  - account executive
  - recruiter
  - it support
  - help desk
  - helpdesk

# Description-level exclusion phrases (need high confidence).
description_exclusions:
  - "10+ years"
  - "8+ years"
  - "12+ years"
  - phd required
  - licensed professional engineer
  - unpaid trial

